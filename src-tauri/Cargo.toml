[package]
name = "zarama-gym"
version = "0.1.0"
description = "ZaramaGYM Sistema de Gestion y Acceso"
edition = "2021"

[lib]
name = "zarama_gym_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
argon2 = { version = "0.5", features = ["password-hash", "std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
axum = "0.7"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["cors"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
if-addrs = "0.13"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tower-service = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
