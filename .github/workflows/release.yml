name: "Publicar Release ZaramaGYM (OTA Windows)"

on:
  push:
    tags:
      - 'v*' # Se dispara al subir un tag como v0.2.0

jobs:
  publish-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias Frontend
        run: npm ci

      - name: Compilar, Firmar (Ed25519) y Publicar Release + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ZaramaGYM v__VERSION__'
          releaseBody: 'Actualización oficial firmada de ZaramaGYM. Tus clientes, base de datos SQLite, credenciales de Gmail/Drive y celulares vinculados se conservan automáticamente.'
          releaseDraft: false
          prerelease: false
